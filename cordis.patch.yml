# ============================================================================
# dsh-gemini-kitten-widget —— DSH bundle patch
# ============================================================================
# 挂载声明:DSH 启动时按 bundle 层栈叠加各插件 patch,本文件把猫娘额度挂件
# 插入 profile 的配置树。
#
# 本地开发安装(本机用的是这条路):
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# 或在该 profile 的 package.json 里加
#   "dsh-gemini-kitten-widget": "link:<本目录绝对路径>"
# 并把 "dsh-gemini-kitten-widget" 加进 dsh.profile.bundles。
# ============================================================================

- insert:
    - id: dsh-gemini-kitten-widget
      name: dsh-gemini-kitten-widget
